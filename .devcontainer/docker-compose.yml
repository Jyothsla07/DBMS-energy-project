# Two containers for GitHub Codespaces:
#   db  - MySQL 8.0, restores backup/energydb.sql the first time it starts
#   app - Python 3.11, shares db's network so MySQL is reachable on localhost
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root   # container-only password, used by the app below
    volumes:
      - mysql-data:/var/lib/mysql
      - ../backup/energydb.sql:/docker-entrypoint-initdb.d/energydb.sql:ro

  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.11-bookworm
    command: sleep infinity
    network_mode: service:db
    depends_on:
      - db
    volumes:
      - ..:/workspaces/energy-db:cached
    environment:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PWD: root
      MYSQL_DB: energydb
      NL2SQL_MODEL: Qwen/Qwen2.5-Coder-3B-Instruct

volumes:
  mysql-data:
